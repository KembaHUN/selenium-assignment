# ============================================================
# Selenium Test Configuration
# ============================================================

# ----------------------------------------------------------
# Application Settings
# ----------------------------------------------------------
app.base_url=https://2kdb.net/

# ----------------------------------------------------------
# Browser Settings
# ----------------------------------------------------------
browser.name=chrome
browser.window_width=1920
browser.window_height=1080
browser.headless=true

# ----------------------------------------------------------
# Timeout Settings (in seconds)
# ----------------------------------------------------------
timeout.implicit_wait=2
timeout.page_load=30

# ----------------------------------------------------------
# Test Credentials
# ----------------------------------------------------------
# Valid test account credentials
test.email=<fill out>
test.password=<fill out>

# Invalid credentials for negative testing
invalid.email=invaliduser@example.com
invalid.password=wrongpassword